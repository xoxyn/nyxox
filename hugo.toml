baseURL = "https://nyxox.dev/"
locale = "en-US"
title = "Victor (nyxox)"
theme = "smol"
copyright = "© 2026 Victor Chinekezi"

enableRobotsTXT = true
enableGitInfo = true
canonifyURLs = false
relativeURLs = false
summaryLength = 30

[params]
subtitle = "neural nets and chill"
description = "Portfolio and technical blog of Victor Chinekezi, covering backend engineering, systems programming, AI infrastructure, developer tooling, and software projects."
author = "Victor Chinekezi"
dateFmt = "2 Jan 2006"
profileImage = "KingSolomon.jpg"
mainSections = ["posts"]
customCSS = ["css/style.css"]

images = ["images/og-default.png"]

[params.icons]
throw_on_error = false

[params.typewriter]
enabled = true
typeMs = 34
deleteMs = 16
holdMs = 2400
lateNightStart = 0
lateNightEnd = 5
phrases = [
  "neural nets and chill",
  "sed -i 's/bug/feature/'",
  "while (alive) { ship(); }",
  "grep'ing my own memory",
  "cargo build && pray",
  "var pile_zero = 0;",
  "psst — press ~",
]
lateNightPhrase = "you should be asleep."

[params.contact]
email= "numterminal@gmail.com"

[pagination]
pagerSize = 10

[sitemap]
changefreq = "weekly"
priority = 0.5
filename = "sitemap.xml"

# [mediaTypes]
# [mediaTypes."application/xml"]
# suffixes = ["xml"]

[outputs]
home = ["HTML", "RSS", "JSON"]
section = ["HTML", "RSS"]
taxonomy = ["HTML", "RSS"]
term = ["HTML", "RSS"]

# [outputFormats]
# [outputFormats.RSS]
# mediaType = "application/xml"
# baseName = "index"
# isPlainText = true

[outputFormats.JSON]
mediaType = "application/json"
baseName = "index"
isPlainText = true

[taxonomies]
category = "categories"
tag = "tags"


[markup]
[markup.highlight]
noClasses = false
style = "bw"

[markup.goldmark]
[markup.goldmark.renderer]
unsafe = false

[module]
[[module.imports]]
path = "github.com/hugomods/icons/vendors/bootstrap"

[[module.imports]]
path = "github.com/hugomods/icons/vendors/font-awesome"
